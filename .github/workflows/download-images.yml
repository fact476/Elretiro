name: Descargar fotos reales El Retiro

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar fotos
        run: |
          mkdir -p imgs
          
          # Funcion de descarga con multiples fuentes
          dl() {
            local out="imgs/$1"
            shift
            for url in "$@"; do
              echo "  Probando: ${url:0:70}"
              curl -sL --max-time 20 --retry 2                 -H "User-Agent: Mozilla/5.0"                 -o "$out" "$url" 2>/dev/null
              size=$(stat -c%s "$out" 2>/dev/null || echo 0)
              if [ "$size" -gt 10000 ]; then
                echo "  OK: $1 fue reemplazado por nombre archivo (${size} bytes)"
                echo "  DESCARGADO: $(basename $out) = ${size} bytes"
                return 0
              fi
              rm -f "$out"
            done
            echo "  FALLO: ninguna fuente funciono para $(basename $out)"
            return 1
          }
          
          echo "=== Descargando fotos reales de El Retiro ==="
          
          # Panoramica zona rural - FUENTES ALTERNATIVAS
          dl "panoramica.jpg"             "https://live.staticflickr.com/65535/52000000000_test.jpg"             "https://images.unsplash.com/photo-1588392382834-a891154bca4d?w=800"             "https://www.elretiro.gov.co/sites/elretiro-antioquia.gov.co/files/styles/galeria_1280x720/public/2023-10/paisaje.jpg"
          
          # Parque principal
          dl "parque.jpg"             "https://www.elretiro.gov.co/sites/elretiro-antioquia.gov.co/files/styles/galeria_1280x720/public/2023-10/parque.jpg"             "https://i.ibb.co/test/parque-retiro.jpg"
          
          echo "=== Resultado ==="
          ls -lh imgs/ 2>/dev/null || echo "Sin fotos"

      - name: Diagnostico de red
        run: |
          echo "=== Test de conectividad ==="
          # Probar diferentes fuentes de imagen
          for url in             "https://upload.wikimedia.org/wikipedia/commons/6/61/Parque_del_Retiro-Antioquia.jpg"             "https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=100"             "https://picsum.photos/100/100"             "https://www.elretiro.gov.co/"             "https://raw.githubusercontent.com/github/gitignore/main/README.md"
          do
            HTTP=$(curl -sL --max-time 10 -w "%{http_code}" -o /tmp/test.bin "$url")
            SIZE=$(wc -c < /tmp/test.bin 2>/dev/null || echo 0)
            echo "HTTP $HTTP | ${SIZE}b | ${url:0:70}"
          done
