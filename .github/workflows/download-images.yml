name: Descargar fotos reales El Retiro

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar con Python
        run: python3 descarga.py

      - name: Subir al repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imgs/ diagnostico.txt
          git diff --staged --quiet || (git commit -m "Fotos reales El Retiro" && git push)
