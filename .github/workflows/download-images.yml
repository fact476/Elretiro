name: Descargar fotos reales El Retiro

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Diagnostico y descarga
        run: |
          mkdir -p imgs
          LOG="diagnostico.txt"
          echo "=== Diagnostico $(date) ===" > $LOG
          
          # Test de conectividad a distintas fuentes
          echo "" >> $LOG
          echo "--- Test de URLs ---" >> $LOG
          
          test_url() {
            HTTP=$(curl -sL --max-time 15 -w "%{http_code}" -o /tmp/img_test.bin               -H "User-Agent: Mozilla/5.0" "$1" 2>/dev/null)
            SIZE=$(wc -c < /tmp/img_test.bin 2>/dev/null || echo 0)
            echo "HTTP:$HTTP SIZE:$SIZE URL:$1" | tee -a $LOG
            rm -f /tmp/img_test.bin
          }
          
          # Wikimedia directo
          test_url "https://upload.wikimedia.org/wikipedia/commons/6/61/Parque_del_Retiro-Antioquia.jpg"
          test_url "https://upload.wikimedia.org/wikipedia/commons/thumb/6/61/Parque_del_Retiro-Antioquia.jpg/640px-Parque_del_Retiro-Antioquia.jpg"
          
          # Archive.org (copia de Wikimedia)
          test_url "https://archive.org/download/wiki-commons/w/images/6/61/Parque_del_Retiro-Antioquia.jpg"
          
          # Otros servicios de imagen
          test_url "https://picsum.photos/800/500"
          test_url "https://source.unsplash.com/800x500/?colombia,mountains"
          test_url "https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=800"
          test_url "https://cdn.pixabay.com/photo/2016/01/09/18/27/journey-1130732_1280.jpg"
          test_url "https://images.pexels.com/photos/346529/pexels-photo-346529.jpeg?w=800"
          test_url "https://media.gettyimages.com/photos/colombia-picture-id123456789"
          test_url "https://elretiro.gov.co/sites/elretiro-antioquia.gov.co/files/2023-10/paisaje.jpg"
          
          echo "" >> $LOG
          echo "--- Intentando descargar fotos reales ---" >> $LOG
          
          # Descargar las que funcionen
          dl() {
            local nombre="$1" url="$2"
            HTTP=$(curl -sL --max-time 20 -w "%{http_code}"               -H "User-Agent: Mozilla/5.0"               -o "imgs/${nombre}" "${url}" 2>/dev/null)
            SIZE=$(wc -c < "imgs/${nombre}" 2>/dev/null || echo 0)
            if [ "$SIZE" -gt 10000 ]; then
              echo "OK: $nombre (${SIZE}b HTTP:$HTTP)" | tee -a $LOG
            else
              echo "FALLO: $nombre (${SIZE}b HTTP:$HTTP)" | tee -a $LOG
              rm -f "imgs/${nombre}"
            fi
          }
          
          # Wikimedia con diferentes User-Agents
          curl -sL --max-time 20 -w "HTTP:%{http_code}
"             -H "User-Agent: curl/7.88"             -H "Referer: https://es.wikipedia.org/"             -o "imgs/parque.jpg"             "https://upload.wikimedia.org/wikipedia/commons/6/61/Parque_del_Retiro-Antioquia.jpg"
          SIZE=$(wc -c < imgs/parque.jpg 2>/dev/null || echo 0)
          echo "Wikimedia curl UA: ${SIZE} bytes" | tee -a $LOG
          [ "$SIZE" -lt 10000 ] && rm -f imgs/parque.jpg
          
          # Picsum (fotos random pero carga siempre)
          dl "test_picsum.jpg" "https://picsum.photos/800/500"
          
          echo "" >> $LOG
          echo "--- Archivos en imgs/ ---" >> $LOG
          ls -lh imgs/ 2>/dev/null | tee -a $LOG || echo "Vacio" | tee -a $LOG
          
          echo "" >> $LOG
          echo "=== FIN DEL DIAGNOSTICO ===" >> $LOG
          cat $LOG

      - name: Guardar resultados en repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostico.txt imgs/ 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Diagnostico de red y fotos disponibles" && git push)
          echo "Listo - revisa diagnostico.txt en el repo"
