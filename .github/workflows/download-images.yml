name: Descargar fotos reales El Retiro

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar fotos
        run: python3 descarga.py

      - name: Subir fotos al repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imgs/
          git diff --staged --quiet && echo "Sin cambios" || (git commit -m "Fotos reales El Retiro - Unsplash/Pixabay" && git push && echo "Push exitoso")
